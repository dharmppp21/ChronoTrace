name: Nightly

# Depth on a different clock from feedback. ci.yml answers "can this merge?" in a few minutes;
# this answers "is anything rotting?" once a day, where nobody is blocked on the result and it
# can afford to be thorough. Day 45 moved the full OS x interpreter matrix here: PRs run a
# three-cell covering set, and the remaining six cells run nightly, so platform coverage is
# delayed rather than lost.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: # so a campaign can be run on demand after a risky change

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # The six cells ci.yml no longer runs on every PR, plus the three it does -- the full nine.
  # Listed as the complete matrix rather than "the leftovers" on purpose: this job is the
  # authoritative platform statement, and it should not silently drift out of agreement with
  # ci.yml if that file's covering set is ever re-chosen.
  matrix:
    name: full matrix / ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Replay equivalence (the referee)
        run: pytest tests/equivalence -q
      - name: Tests
        run: pytest -m "not perf"

  campaign:
    name: campaign / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One OS, every interpreter. The campaign hunts semantic bugs in recording and
        # reconstruction, which are interpreter-dependent (generators and frame
        # finalisation differ across 3.12-3.14) and not OS-dependent -- the platform
        # differences that matter are mmap and CRLF, which the `matrix` job above covers.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 3,000 examples against the per-push 40. A bug that shows up in one program per
      # thousand has room to surface here and nowhere else.
      - name: Campaign
        run: pytest tests/property --hypothesis-profile=nightly -q

      # A failing example is the whole product of this run. Hypothesis writes it to its
      # database, so keeping that turns "the nightly went red" into a reproduction the
      # next `pytest` replays first, rather than a bug nobody can find again.
      - name: Keep the failing examples
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hypothesis-examples-py${{ matrix.python-version }}
          path: .hypothesis/examples
          if-no-files-found: ignore

  # A nightly reproducibility guard, NOT a performance trend. GitHub-hosted runners are
  # ephemeral and their timing variance swamps the signal, which would violate the
  # pinned-environment rule in benchmarks/METHODOLOGY.md -- so this does not chart numbers
  # across nights. What it does guard: that `python -m benchmarks` still RUNS end to end and
  # produces RESULTS.md (imports, subprocess protocol, coverage.py baseline, the store and
  # reconstruct paths), and it archives each night's RESULTS.md as a diffable artifact. A
  # real trend needs a fixed machine; that is a manual `python -m benchmarks` on one, not CI.
  benchmark-smoke:
    name: benchmark smoke (--quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate the quick benchmark block
        run: python -m benchmarks --quick
      - name: Archive this night's RESULTS.md
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmarks/RESULTS.md

  # The demo image is NOT built here. docker.yml owns it end to end and carries its own nightly
  # schedule, so there is one place that knows how to build and smoke-test the image rather than
  # two that must be kept in agreement.
