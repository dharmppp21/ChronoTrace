name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR should never be able to leak write access. Day 45 hardens this further and
# pins actions to commit SHAs; tags are acceptable while nothing here can publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the other eight cells because one failed. The whole point of
      # the matrix is finding out WHICH platforms break, not that one did.
      fail-fast: false
      matrix:
        # Windows is not optional here. It is the development machine, and it is
        # the platform most likely to break this specific project: CRLF
        # translation would corrupt the binary .chrono format, path separators
        # differ, file locking is stricter (a real risk for the live tailing in
        # Phase 5), and mmap semantics are not POSIX. If Windows only gets tested
        # by hand, it gets tested rarely and late.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      # Run before the full suite, and separately from it. Separately, because this is
      # the only test that compares ChronoTrace against reality rather than against
      # itself -- when it breaks, the matrix should say so by name instead of burying it
      # among a few hundred green dots. First, because it is the fastest way to learn the
      # debugger has started lying. A red referee blocks merge; see CONTRIBUTING.md.
      - name: Replay equivalence (the referee)
        run: pytest tests/equivalence -q

      # The `ci` profile: 40 examples, a few seconds. Deliberately shallow -- depth lives
      # in the nightly campaign (.github/workflows/nightly.yml), because a per-push check
      # that takes twenty minutes to report a failure is one people learn to ignore.
      - name: Property campaign (fast profile)
        run: pytest tests/property --hypothesis-profile=ci -q

      - name: Tests
        run: pytest

  # The frontend (Phase 5, day 35) is built in Antigravity and lands in `frontend/`. These
  # steps are guarded on that directory existing, so this job is green today (they skip) and
  # enforces build + types + tests the moment the UI is committed -- a DTO change that breaks
  # the generated client then fails the build here, not in a demo. A single Linux runner: the
  # frontend is platform-independent, unlike the .chrono format the matrix above guards.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        if: hashFiles('frontend/package.json') != ''
        run: npm run typecheck
        working-directory: frontend

      - name: Test
        if: hashFiles('frontend/package.json') != ''
        run: npm test
        working-directory: frontend

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        run: npm run build
        working-directory: frontend
