name: CI

# Fast feedback, on every push and PR. The rule this file is organised around: a check
# people wait for is a check people read. Anything that does not change the merge decision
# within a few minutes belongs in nightly.yml, not here.
#
# Measured before the day-45 split: 13 jobs, 5.5 min wall-clock, 40.6 min of runner time.
# The wall-clock was already fine; the waste was elsewhere. Two things changed:
#   * lint/format/mypy ran on all nine matrix cells and computed the SAME answer nine times
#     (see the `static` job for why that is structurally guaranteed) -- now once.
#   * the nine-cell OS x interpreter matrix moved to a three-cell covering set here, with
#     the full nine running nightly. Platform coverage is not lost, it is off the critical path.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: read-only, and every job below inherits it. Nothing in this
# workflow publishes, so nothing here needs write. Release permissions live in release.yml,
# scoped per job. A fork PR gets no secrets, and every job here runs without them by design.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format and types: ONCE, not nine times. This is safe by construction, not by luck:
  #   * `ruff format --check` is byte-deterministic, and .gitattributes normalises line endings
  #     in the repo, so the OS the checker runs on cannot change its answer.
  #   * mypy is pinned to `python_version = "3.12"` in pyproject.toml, so it type-checks against
  #     3.12 semantics no matter which interpreter executes it -- the runner's Python is
  #     irrelevant to the result.
  # Running these nine times bought nine identical answers. Running once buys the same signal
  # ~90 seconds sooner on the cells that used to carry it.
  static:
    name: static (lint, format, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel a sibling cell because one failed. The point of a matrix is finding out
      # WHICH platform breaks, not that one did.
      fail-fast: false
      matrix:
        # A three-cell covering set, not a truncation: every OS appears once and every
        # interpreter appears once, so no platform and no Python version is unrepresented on a PR.
        # The pairs are chosen for risk, not symmetry:
        #   * windows x 3.14 -- Windows is the platform most likely to break THIS project (CRLF
        #     translation would corrupt the binary .chrono format, path separators differ, file
        #     locking is stricter for Phase 5 live tailing, mmap is not POSIX), paired with the
        #     newest interpreter, where generator and frame-finalisation semantics moved most.
        #   * ubuntu x 3.12 -- the floor. If it works on the oldest supported interpreter it
        #     works above, and ubuntu is where contributors and CI consumers actually are.
        #   * macos x 3.13 -- keeps the third OS and the middle interpreter honest.
        # The accepted trade: a bug specific to an untested pair (say windows x 3.12) reaches
        # main and is caught by the nightly nine-cell matrix within a day rather than at PR time.
        # That is the deliberate price of a PR check that stays under five minutes.
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run before the full suite, and separately from it. Separately, because this is
      # the only test that compares ChronoTrace against reality rather than against
      # itself -- when it breaks, the matrix should say so by name instead of burying it
      # among a few hundred green dots. First, because it is the fastest way to learn the
      # debugger has started lying. A red referee blocks merge; see CONTRIBUTING.md.
      - name: Replay equivalence (the referee)
        run: pytest tests/equivalence -q

      # The `ci` profile: 40 examples, a few seconds. Deliberately shallow -- depth lives
      # in the nightly campaign (.github/workflows/nightly.yml), because a per-push check
      # that takes twenty minutes to report a failure is one people learn to ignore.
      - name: Property campaign (fast profile)
        run: pytest tests/property --hypothesis-profile=ci -q

      - name: Tests
        run: pytest -m "not perf"  # perf guards run on one consistent runner (the `perf` job)

  # Performance regression guards (day 41). Timing-sensitive, so run on ONE consistent runner
  # rather than the OS/Python matrix, where bursty macOS/Windows timing would flake a threshold.
  # A single Linux box, tolerances chosen with a ~10x margin over the dev number (see the test).
  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Perf regression guards
        run: pytest -m perf -q

  # Packaging (Phase 7, day 44). Builds the real wheel -- the frontend build hook runs here, so
  # Node is set up -- then proves two things a matrix `pip install -e` never can: the wheel's
  # CONTENTS are right (UI bundled, tests/spikes/benchmarks and source maps NOT), and it installs
  # and works in a container with NO compiler, NO Node, and NO pip cache. "Works on my machine" is
  # exactly the failure this catches; ten weeks of accumulated state do not exist in the container.
  # It stays on the PR path because it is fast (~50s) and it guards the artifact users receive.
  package:
    name: package (wheel + clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"  # the floor: if the wheel installs here, it installs above
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in step with the `ui` stage in the Dockerfile. Dependabot bumps the image
          # there but cannot see this value, so left alone they drift -- and then CI builds the
          # frontend with one toolchain while the published image builds it with another, which
          # is exactly the reproducibility property the wheel is supposed to have.
          node-version: "26"

      - name: Build the wheel (the frontend build hook runs here)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Assert wheel contents (UI in, tests/spikes/benchmarks/source-maps out, size sane)
        # hypothesis too: the root conftest imports it and pyproject's addopts select a
        # hypothesis profile, so pytest cannot even collect without it. test_wheel itself only
        # inspects the built dist/*.whl -- it imports nothing from chronotrace.
        run: |
          pip install pytest hypothesis
          pytest tests/packaging -q

      - name: Clean-room install -- no compiler, no Node, no cache (Dockerfile.clean)
        # Every RUN in the Dockerfile is an assertion; a failed `docker build` IS the caught bug.
        run: docker build -f tests/packaging/Dockerfile.clean -t chronotrace-clean .

  # The frontend (Phase 5) lands in `frontend/`. These steps are guarded on that directory
  # existing so the job degrades rather than fails on a tree without it -- a DTO change that
  # breaks the generated client fails the build here, not in a demo. A single Linux runner: the
  # frontend is platform-independent, unlike the .chrono format the matrix above guards.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in step with the `ui` stage in the Dockerfile. Dependabot bumps the image
          # there but cannot see this value, so left alone they drift -- and then CI builds the
          # frontend with one toolchain while the published image builds it with another, which
          # is exactly the reproducibility property the wheel is supposed to have.
          node-version: "26"

      - name: Install
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        if: hashFiles('frontend/package.json') != ''
        run: npm run typecheck
        working-directory: frontend

      - name: Test
        if: hashFiles('frontend/package.json') != ''
        run: npm test
        working-directory: frontend

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        run: npm run build
        working-directory: frontend

  # End-to-end (Phase 5, day 39): the thinnest full-stack proof -- load a recording in the real
  # UI, scrub, assert the rendered variables change. The frontend project owns
  # playwright.config.ts, whose `webServer` starts `chronotrace serve` over the ./recordings
  # fixture this job records below. See frontend/tests/e2e/test_scrub.spec.ts.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in step with the `ui` stage in the Dockerfile. Dependabot bumps the image
          # there but cannot see this value, so left alone they drift -- and then CI builds the
          # frontend with one toolchain while the published image builds it with another, which
          # is exactly the reproducibility property the wheel is supposed to have.
          node-version: "26"

      - name: Install (server + UI extra)
        if: hashFiles('frontend/package.json') != ''
        run: pip install -e ".[ui]"

      - name: Build the UI
        if: hashFiles('frontend/package.json') != ''
        run: npm ci && npm run build
        working-directory: frontend

      - name: Record the fixture the webServer serves
        if: hashFiles('frontend/package.json') != ''
        # into frontend/recordings (gitignored, so it does not exist on a fresh checkout -- mkdir
        # it; record --out does not create the parent). Flags BEFORE the positional script --
        # argparse.REMAINDER eats everything after it.
        run: |
          mkdir -p frontend/recordings
          python -m chronotrace.cli record --out frontend/recordings/demo.chrono examples/buggy_pipeline.py

      - name: Install Playwright browser
        if: hashFiles('frontend/package.json') != ''
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run the scrub test
        if: hashFiles('frontend/package.json') != ''
        # testDir (./tests/e2e) is set in playwright.config.ts; its webServer starts the app.
        run: npx playwright test
        working-directory: frontend
